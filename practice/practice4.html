<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/output.css" />
    <title>Practice</title>
  </head>
  <body class="font-display">
    <section
      class="relative overflow-hidden min-h-screen bg-linear-to-br from-brand-purple to-purple-950 text-white flex items-center"
    >
      <div
        class="absolute -top-20 -left-20 w-72 h-72 bg-brand-yellow/20 rounded-full blur-3xl"
      ></div>

      <div
        class="absolute -bottom-24 -right-24 w-96 h-96 bg-purple-400/30 rounded-full blur-3xl"
      ></div>

      <div class="relative max-w-4xl mx-auto px-6 py-20 text-center">
        <span
          class="inline-block bg-white/10 border border-white/20 px-4 py-1 rounded-full text-sm"
          >Now open for projects</span
        >

        <h1
          class="mt-6 text-4xl sm:text-5xl lg:text-7xl leading-tight font-extrabold"
        >
          Design it. Build it.
          <span
            class="block bg-linear-to-r from-brand-yellow to-pink-400 bg-clip-text text-transparent"
            >Ship it.</span
          >
        </h1>
        <p class="mt-6 text-base sm:text-lg text-purple-100 max-w-2xl mx-auto">
          I turn ideas into clean, fast interfaces, from the first Figma frama
          to the final line of code.
        </p>

        <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
          <a
            href="#"
            class="bg-brand-yellow text-gray-900 font-semibold px-8 py-3 rounded-xl hover:brightness-110 transition"
            >View My Work</a
          >
          <a
            href="#"
            class="border border-white/40 px-8 py-3 rounded-xl font-semibold hover:bg-white/10 transition"
            >Get in Touch</a
          >
        </div>

        <div class="flex justify-center gap-10 sm:gap-16 mt-16">
          <div>
            <p class="text-3xl font-bold text-brand-yellow">24+</p>
            <p class="text-sm text-purple-200">Projects</p>
          </div>
          <div>
            <p class="text-3xl font-bold text-brand-yellow">3 yrs</p>
            <p class="text-sm text-purple-200">Experience</p>
          </div>
          <div>
            <p class="text-3xl font-bold text-brand-yellow">100%</p>
            <p class="text-sm text-purple-200">Dedication</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
