<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet" />
    <title>Design 3</title>
  </head>
  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="sticky top-0 bg-white shadow-md">
      <div
        class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <!-- Logo -->
        <a href="#" class="text-2xl font-bold text-purple-600">Fioré</a>

        <!-- Desktop links -->
        <div
          class="hidden md:flex items-center gap-8 text-gray-600 font-medium"
        >
          <a href="#" class="hover:text-purple-600">Home</a>
          <a href="#" class="hover:text-purple-600">Work</a>
          <a href="#" class="hover:text-purple-600">About</a>
          <a href="#" class="hover:text-purple-600">Contact</a>
        </div>

        <!-- Desktop button -->
        <button
          class="hidden md:block bg-purple-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-purple-700"
        >
          Hire Me
        </button>

        <!-- Hamburger (mobile only) -->
        <button id="menu-btn" class="md:hidden text-3xl text-gray-700">
          ☰
        </button>
      </div>

      <!-- Mobile menu -->
      <div
        id="menu"
        class="hidden md:hidden border-t border-gray-200 px-6 py-4 space-y-4 text-gray-600 font-medium"
      >
        <a href="#" class="block hover:text-purple-600">Home</a>
        <a href="#" class="block hover:text-purple-600">Work</a>
        <a href="#" class="block hover:text-purple-600">About</a>
        <a href="#" class="block hover:text-purple-600">Contact</a>
        <button
          class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700"
        >
          Hire Me
        </button>
      </div>
    </nav>

    <!-- Filler content so you can see the sticky effect -->
    <main class="max-w-6xl mx-auto p-6 space-y-6">
      <div class="h-64 bg-white rounded-2xl shadow"></div>
      <div class="h-64 bg-white rounded-2xl shadow"></div>
      <div class="h-64 bg-white rounded-2xl shadow"></div>
    </main>

    <script>
      const btn = document.getElementById("menu-btn");
      const menu = document.getElementById("menu");

      btn.addEventListener("click", () => {
        menu.classList.toggle("hidden");
      });
    </script>
  </body>
</html>
