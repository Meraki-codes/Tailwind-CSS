<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet" />
    <title>Design 2</title>
  </head>
  <body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
    <div class="flex flex-col md:flex-row gap-6 items-center">
      <!-- Basic -->
      <div
        class="bg-white w-72 rounded-2xl shadow-md p-8 transition hover:-translate-y-2 hover:shadow-xl"
      >
        <h2 class="text-lg font-semibold text-gray-800">Basic</h2>
        <p class="mt-4 text-4xl font-bold text-gray-900">
          $0<span class="text-base font-normal text-gray-500">/mo</span>
        </p>
        <ul class="mt-6 space-y-3 text-sm text-gray-600">
          <li>✓ 1 project</li>
          <li>✓ Basic analytics</li>
          <li>✓ Community support</li>
        </ul>
        <button
          class="mt-8 w-full border border-purple-600 text-purple-600 py-2 rounded-lg font-medium hover:bg-purple-50"
        >
          Get Started
        </button>
      </div>

      <!-- Pro (highlighted) -->
      <div
        class="relative bg-purple-600 w-72 rounded-2xl shadow-xl p-8 text-white ring-4 ring-purple-300 transition hover:-translate-y-2 hover:shadow-2xl"
      >
        <span
          class="absolute -top-3 left-1/2 -translate-x-1/2 bg-yellow-400 text-gray-900 text-xs font-bold px-3 py-1 rounded-full"
        >
          MOST POPULAR
        </span>
        <h2 class="text-lg font-semibold">Pro</h2>
        <p class="mt-4 text-4xl font-bold">
          $19<span class="text-base font-normal text-purple-200">/mo</span>
        </p>
        <ul class="mt-6 space-y-3 text-sm text-purple-100">
          <li>✓ 10 projects</li>
          <li>✓ Advanced analytics</li>
          <li>✓ Priority support</li>
          <li>✓ Custom domain</li>
        </ul>
        <button
          class="mt-8 w-full bg-white text-purple-600 py-2 rounded-lg font-medium hover:bg-purple-50"
        >
          Go Pro
        </button>
      </div>

      <!-- Team -->
      <div
        class="bg-white w-72 rounded-2xl shadow-md p-8 transition hover:-translate-y-2 hover:shadow-xl"
      >
        <h2 class="text-lg font-semibold text-gray-800">Team</h2>
        <p class="mt-4 text-4xl font-bold text-gray-900">
          $49<span class="text-base font-normal text-gray-500">/mo</span>
        </p>
        <ul class="mt-6 space-y-3 text-sm text-gray-600">
          <li>✓ Unlimited projects</li>
          <li>✓ Team workspace</li>
          <li>✓ Dedicated support</li>
        </ul>
        <button
          class="mt-8 w-full border border-purple-600 text-purple-600 py-2 rounded-lg font-medium hover:bg-purple-50"
        >
          Contact Us
        </button>
      </div>
    </div>
  </body>
</html>
